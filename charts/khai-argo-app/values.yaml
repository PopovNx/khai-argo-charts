replicaCount: 1

image:
  repository: ghcr.io/popovnx/khai-argo-app
  pullPolicy: IfNotPresent
  tag: "0.1.2"

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: khai-argo-app.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi
